<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS Phone Scanner</title>
<style>
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100dvh}
  .wrap{max-width:520px;margin:0 auto;padding:14px}
  h1{font-size:18px;margin:4px 0 10px}
  .card{background:#1e293b;border-radius:14px;padding:12px;margin-bottom:12px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:15px}
  button{border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:700;background:#0d9488;color:#fff;width:100%}
  button.sec{background:#334155}
  .row{display:flex;gap:8px}
  .row>*{flex:1;min-width:0}
  #reader video{width:100%!important;height:auto!important}
  #reader{max-width:100%}
  #reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:240px}
  #status{padding:10px 12px;border-radius:10px;font-weight:600;background:#334155;margin-bottom:10px}
  #status.ok{background:#064e3b;color:#a7f3d0}
  #status.err{background:#7f1d1d;color:#fecaca}
  .log div{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed #475569}
  .muted{color:#94a3b8;font-size:13px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>📡 POS Phone Scanner</h1>

  <div class="card" id="setup">
    <div class="muted" style="margin-bottom:8px">POS ka URL (POS mein 📡 Phone dabane par milta hai). Sirf ek baar paste karein.</div>
    <input id="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    <div style="height:8px"></div>
    <button id="saveBtn">Save &amp; Camera shuru karein</button>
  </div>

  <div id="main" class="hide">
    <div id="status">Camera shuru ho raha hai...</div>
    <div id="reader"></div>
    <div class="card" style="margin-top:12px">
      <div class="row">
        <input id="manual" inputmode="numeric" placeholder="ID haath se likhein">
        <button id="manualBtn" style="flex:0 0 90px">Add</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between"><b>Scan hue</b><b><span id="total">0</span> items</b></div>
      <div class="log" id="log"></div>
    </div>
    <div class="row">
      <button class="sec" id="restartBtn">🔄 Camera dobara</button>
      <button class="sec" id="changeBtn">⚙ URL badlein</button>
    </div>
  </div>
</div>

<script>
(function () {
  var LIBS = [
    'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js',
    'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
    'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'
  ];
  var $ = function (id) { return document.getElementById(id); };
  var base = '', scanner = null, last = { code: '', t: 0 }, counts = {}, order = [], total = 0, audio = null;

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }
  function status(msg, kind) { $('status').textContent = msg; $('status').className = kind || ''; }

  function beep(f, ms) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; g.gain.value = 0.15; o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + ms / 1000);
    } catch (e) {}
  }
  function feedback(ok) {
    beep(ok ? 1200 : 300, ok ? 90 : 220);
    if (navigator.vibrate) { try { navigator.vibrate(ok ? 30 : [60, 40, 60]); } catch (e) {} }
  }

  function loadLib() {
    if (window.Html5Qrcode) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var i = 0;
      (function next() {
        if (i >= LIBS.length) return reject(new Error('Scanner library load nahi hui (internet check karein)'));
        var s = document.createElement('script');
        s.src = LIBS[i++];
        s.onload = function () { window.Html5Qrcode ? resolve() : next(); };
        s.onerror = function () { s.remove(); next(); };
        document.head.appendChild(s);
      })();
    });
  }

  function renderLog() {
    $('total').textContent = total;
    $('log').innerHTML = order.map(function (id) {
      var c = counts[id];
      return '<div><span>' + (c.ok ? '✓ ' : '✖ ') + esc(c.name) + '</span><b>' + (c.ok ? '× ' + c.n : '') + '</b></div>';
    }).join('');
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function send(code, live) {
    code = String(code || '').trim();
    if (!code) return;
    var now = Date.now();
    if (live) {
      var same = code === last.code, gap = now - last.t;
      last = { code: code, t: now };
      if (same && gap < 1500) return;
    }
    status('Bhej raha hoon: ' + code + '...');
    fetch(base + (base.indexOf('?') > -1 ? '&' : '?') + 'action=scan&code=' + encodeURIComponent(code) + '&_=' + now, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var d;
        try { d = JSON.parse(t); } catch (e) { throw { kind: 'notjson' }; }
        return d;
      })
      .then(function (d) {
        if (d && d.ok) {
          feedback(true);
          var c = counts[d.id] || (counts[d.id] = { name: d.name, n: 0, ok: true });
          if (!c.n) order.unshift(d.id);
          c.n++; total++;
          status('✓ ' + d.name + ' (Rs. ' + d.price + ') POS mein add', 'ok');
        } else {
          feedback(false);
          status('✖ ' + (d && d.error === 'not_found' ? 'Barcode nahi mila: ' + code : 'Error: ' + (d && d.error)), 'err');
        }
        renderLog();
      })
      .catch(function (e) {
        feedback(false);
        if (e && e.kind === 'notjson') {
          status('✖ POS ne scanner ka jawab nahi diya. Apps Script mein Code.gs naya paste karke Deploy → Manage deployments → Edit → New version karein.', 'err');
        } else {
          status('✖ POS tak pohanch nahi saka. Deploy karte waqt "Who has access" = Anyone rakhein, aur URL sahi paste karein.', 'err');
        }
      });
  }

  function stop() {
    var s = scanner; scanner = null;
    if (!s) return Promise.resolve();
    return s.stop().catch(function () {}).then(function () { try { s.clear(); } catch (e) {} });
  }

  function start() {
    $('setup').classList.add('hide');
    $('main').classList.remove('hide');
    status('Camera shuru ho raha hai...');
    stop().then(loadLib).then(function () {
      var F = window.Html5QrcodeSupportedFormats;
      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [F.CODE_128, F.EAN_13, F.EAN_8, F.UPC_A, F.CODE_39, F.QR_CODE],
        useBarCodeDetectorIfSupported: true,
        verbose: false
      });
      return scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 130 },
        videoConstraints: { facingMode: 'environment', focusMode: 'continuous', width: { ideal: 1280 }, height: { ideal: 720 } } },
        function (t) { send(t, true); }, function () {});
    }).then(function () {
      status('Barcode ko 15-20 cm door rakhein (bohat qareeb se blur hota hai) — khud POS mein add hoga.');
    }).catch(function (e) {
      scanner = null;
      status('✖ Camera nahi chala: ' + String((e && e.message) || e).slice(0, 120) + ' — browser mein camera permission dein (https page honi chahiye).', 'err');
    });
  }

  function begin(url) {
    url = String(url || '').trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url) && !/^https:\/\/script\.google\.com\/macros\/s\/.+/.test(url)) {
      alert('Ye POS ka sahi URL nahi lagta. POS mein 📡 Phone dabayein aur wahan se copy karein.');
      return;
    }
    base = url.split('?')[0];
    store('posUrl', base);
    try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    start();
  }

  $('saveBtn').onclick = function () { begin($('url').value); };
  $('restartBtn').onclick = start;
  $('changeBtn').onclick = function () {
    stop(); $('main').classList.add('hide'); $('setup').classList.remove('hide'); $('url').value = base;
  };
  $('manualBtn').onclick = function () { send($('manual').value, false); $('manual').value = ''; };
  $('manual').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('manualBtn').click(); });

  var q = new URLSearchParams(location.search).get('u');
  var saved = q || store('posUrl');
  if (saved) { $('url').value = saved; begin(saved); }
})();
</script>
</body>
</html>
